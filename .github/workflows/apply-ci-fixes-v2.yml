name: Apply CI compatibility fixes v2

on:
  push:
    branches:
      - feat/initial-chat-relay
    paths:
      - .github/workflows/apply-ci-fixes-v2.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/initial-chat-relay
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply idempotent Workers compatibility fixes
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          storage_path = Path("src/relay-storage.ts")
          storage = storage_path.read_text(encoding="utf-8")
          for name in ("StateRow", "CommentRow"):
              interface_pattern = rf"(interface\s+{name}\s*\{{\n)(?!\s*\[key:\s*string\])"
              storage, count = re.subn(
                  interface_pattern,
                  r"\1  [key: string]: SqlStorageValue;\n",
                  storage,
                  count=1,
              )
              if count == 0 and f"interface {name}" not in storage:
                  alias_pattern = rf"(type\s+{name}\s*=\s*\{{\n)(?!\s*\[key:\s*string\])"
                  storage, _ = re.subn(
                      alias_pattern,
                      r"\1  [key: string]: SqlStorageValue;\n",
                      storage,
                      count=1,
                  )
          storage_path.write_text(storage, encoding="utf-8")

          relay_path = Path("src/relay.ts")
          relay = relay_path.read_text(encoding="utf-8")
          relay = re.sub(
              r"(?m)^(\s*)(?!override\s+)async alarm\(",
              r"\1override async alarm(",
              relay,
              count=1,
          )
          relay_path.write_text(relay, encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          dev_dependencies = package.setdefault("devDependencies", {})
          dev_dependencies.setdefault("@types/node", "^22.0.0")
          package["devDependencies"] = dict(sorted(dev_dependencies.items()))
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          workflow_path = Path(".github/workflows/ci.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace("actions/checkout@v4", "actions/checkout@v5")
          workflow = workflow.replace("actions/setup-node@v4", "actions/setup-node@v5")
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Install dependencies and generate Worker types
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run types

      - name: Resolve URL conversion only when needed
        shell: bash
        run: |
          if npx tsc --noEmit; then
            exit 0
          fi
          python <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          index_path = Path("src/index.ts")
          lines = index_path.read_text(encoding="utf-8").splitlines(keepends=True)
          target_index = 13
          source_line = lines[target_index]

          argument_pattern = re.compile(
              r"url(?:\.pathname|\.href|\.toString\(\))?"
          )

          def with_argument(replacement: str) -> str:
              if ".exec(" in source_line:
                  return re.sub(
                      r"(?<=\.exec\()url(?:\.pathname|\.href|\.toString\(\))?(?=\))",
                      replacement,
                      source_line,
                      count=1,
                  )
              return argument_pattern.sub(replacement, source_line, count=1)

          failures: list[str] = []
          for replacement in ("url.pathname", "url.href", "url.toString()"):
              candidate = list(lines)
              candidate[target_index] = with_argument(replacement)
              index_path.write_text("".join(candidate), encoding="utf-8")
              result = subprocess.run(
                  ["npx", "tsc", "--noEmit"],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              if result.returncode == 0:
                  break
              failures.append(f"{replacement}:\n{result.stdout}")
          else:
              index_path.write_text("".join(lines), encoding="utf-8")
              raise SystemExit("No URL conversion compiled:\n" + "\n".join(failures))
          PY

      - name: Typecheck and test
        run: npm run check

      - name: Commit verified fixes and remove temporary workflows
        shell: bash
        run: |
          rm -f -- \
            .github/workflows/apply-ci-fixes.yml \
            .github/workflows/apply-ci-fixes-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/apply-ci-fixes.yml \
            .github/workflows/apply-ci-fixes-v2.yml \
            .github/workflows/ci.yml \
            package.json \
            package-lock.json \
            src/index.ts \
            src/relay-storage.ts \
            src/relay.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: align implementation with current Workers types"
          git push origin HEAD:feat/initial-chat-relay
